[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsoc-langgraph"
version = "0.1.0"
description = "Evidence-first, local-first security alert investigation with LangGraph and ATT&CK retrieval"
requires-python = ">=3.10"
dependencies = ["langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4", "chromadb>=1.3,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "scikit-learn>=1.5,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
llm = ["llama-cpp-python>=0.3,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
